<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="ClaimCourt">
  <rect width="96" height="96" rx="20" fill="#1f2a44"/>

  <!-- the rule: a clause of published wording -->
  <rect x="18" y="16" width="34" height="44" rx="4" fill="#f4f1ea"/>
  <rect x="24" y="24" width="22" height="3" rx="1.5" fill="#1f2a44" opacity="0.75"/>
  <rect x="24" y="32" width="22" height="3" rx="1.5" fill="#1f2a44" opacity="0.45"/>
  <rect x="24" y="40" width="16" height="3" rx="1.5" fill="#1f2a44" opacity="0.45"/>
  <rect x="24" y="48" width="19" height="3" rx="1.5" fill="#1f2a44" opacity="0.45"/>

  <!-- the notice: the reason given, laid against it -->
  <rect x="44" y="36" width="34" height="44" rx="4" fill="#ffffff"/>
  <rect x="50" y="44" width="22" height="3" rx="1.5" fill="#1f2a44" opacity="0.75"/>
  <rect x="50" y="52" width="22" height="3" rx="1.5" fill="#1f2a44" opacity="0.45"/>
  <rect x="50" y="60" width="14" height="3" rx="1.5" fill="#1f2a44" opacity="0.45"/>

  <!-- the reading: one quote held against the other -->
  <path d="M50 70 h22" stroke="#e0a43b" stroke-width="4" stroke-linecap="round"/>
  <path d="M28 59 l12 12" stroke="#e0a43b" stroke-width="4" stroke-linecap="round"/>
</svg>
